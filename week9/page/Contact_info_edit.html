<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>Contact info edit</title>
</head>

<body>
    <div class="container">
        <div class="contact_wrap">
            <a href="./Account.html" class="contact_prev_btn">
                <img src="../assets/src/img/prev.svg" alt="뒤로가기">
            </a>

            <header class="contact_header">
                <h1>Contact info</h1>
            </header>

            <div class="contact_profile">
                <div class="contact_profile_img_box">
                    <img src="../assets/src/img/profile.png" alt="profile" class="contact_profile_img">
                    <img src="../assets/src/img/edit.svg" alt="edit" class="edit_icon">
                </div>
            </div>

            <div class="contact_info_list">

                <div class="contact_info_item">
                    <div class="contact_info_top">
                        <p>Name</p>
                        <a href="#">Change</a>
                    </div>
                    <h2>Warren Buffet</h2>
                </div>

                <div class="contact_info_item">
                    <div class="contact_info_top">
                        <p>Birthdate</p>
                        <a href="#">Change</a>
                    </div>
                    <h2>05 November 1993</h2>
                </div>

                <div class="contact_info_item">
                    <div class="contact_info_top">
                        <p>Gender</p>
                        <a href="#">Change</a>
                    </div>
                    <h2>Male</h2>
                </div>

                <div class="contact_info_item">
                    <div class="contact_info_top">
                        <p>Email</p>
                        <a href="#">Change</a>
                    </div>
                    <h2>warren.buff@invest.ai</h2>
                </div>

                <div class="contact_info_item">
                    <div class="contact_info_top">
                        <p>Phone Number</p>
                    </div>
                    <h2>-</h2>
                </div>

                <div class="contact_info_item no_line">
                    <div class="contact_info_top">
                        <p>Address</p>
                    </div>
                    <h2>-</h2>
                </div>

            </div>

        </div>
    </div>
</body>

</html>
