<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>Product</title>
</head>

<body>
    <div class="container product_container">
        <div class="product_wrap">
            <header class="product_header">
                <h2>My Asset</h2>
                <a href="./Homepage.html" class="close_btn">
                    <img class="close_img" src="../assets/src/img/close.svg" alt="close">
                </a>
            </header>

            <div class="product_text">
                <p>Your total asset portfolio</p>
                <div class="asset_total">
                    <h1>N203,935</h1>
                    <img class="up_img" src="../assets/src/img/up.png" alt="">
                </div>
            </div>

            <div class="current_plan">
                <h2>Current Plans</h2>
                <img class="gold_img" src="../assets/src/img/gold.png" alt="gold plan">
                <a href="#" class="see_plan">See All Plans →</a>
            </div>

            <div class="history">
                <h2>History</h2>
                <div class="history_box">
                    <h3>Rp 200.000</h3>
                    <div class="history_info">
                        <p>Buy “APPL” Stock</p>
                        <span>TUE 22 Jun 2020</span>
                    </div>
                </div>

                <div class="history_box green">
                    <h3>Rp 150.000</h3>
                    <div class="history_info">
                        <p>Sell “TLKM” Stock</p>
                        <span>TUE 22 Jun 2020</span>
                    </div>
                </div>

                <div class="history_box">
                    <h3>Rp 1.000.240</h3>
                    <div class="history_info">
                        <p>Buy “FB” Stock</p>
                        <span>TUE 22 Jun 2020</span>
                    </div>
                </div>

                <div class="history_box green">
                    <h3>Rp 1.000.240</h3>
                    <div class="history_info">
                        <p>Sell “APPL” Stock</p>
                        <span>TUE 22 Jun 2020</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
