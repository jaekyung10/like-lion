<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <title>start-sign-up</title>
</head>

<body>
    <div class="container">
        <div class="account_wrap">

            <a href="./Sign_up_start_page.html" class="prev_btn">
                <img src="../assets/src/img/prev.svg" alt="뒤로가기" class="prev_icon">
            </a>

            <div class="account_text">
                <p>Create an account</p>
            </div>

            <div class="account_text2">
                <p>Invest and double your income now</p>
            </div>

            <form class="create_account" action="./Homepage.html">
                <input type="text" placeholder="Full name">
                <input type="email" placeholder="Email address">
                <input type="password" placeholder="Password">

                <button type="submit" class="account_create_btn">
                    Create account
                </button>
            </form>

            <div class="account_text3">
                <p>Already have an account?</p>
            </div>

        </div>
    </div>

</body>

</html>
